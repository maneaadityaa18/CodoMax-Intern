<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogHub | Create Blog</title>
    <link rel="stylesheet" href="/public/css/style.css">
</head>
<body>
    <header class="topbar">
        <nav class="navbar container">
            <a href="index.html" class="logo"> BlogHub</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="blog.html" class="active">Create Blog</a>
            </div>
        </nav>
    </header>

    <main class="page-shell">
        <section class="container form-section">
            <div class="form-card">
                <div class="form-intro">
                    <p class="eyebrow">Create a story</p>
                    <h1>Add a new blog</h1>
                    <p>Share your latest thoughts with a polished publishing experience.</p>
                </div>

                <form id="blogForm" class="blog-form">
                    <div class="form-group">
                        <label for="title">Blog Title</label>
                        <input type="text" id="title" placeholder="Enter blog title" required>
                    </div>

                    <div class="form-group">
                        <label for="author">Author Name</label>
                        <input type="text" id="author" placeholder="Enter author name" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <input type="text" id="category" placeholder="Technology" required>
                    </div>

                    <div class="form-group">
                        <label for="content">Blog Content</label>
                        <textarea id="content" rows="8" placeholder="Write your blog..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary full">Publish Blog</button>
                </form>
            </div>

            <aside class="preview-card">
                <h3>What makes a great blog?</h3>
                <ul>
                    <li>A clear and engaging title</li>
                    <li>Helpful structure and flow</li>
                    <li>A strong closing thought</li>
                </ul>
            </aside>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 BlogHub | Built during Codomax Internship</p>
    </footer>

    <script src="/public/js/scirpt.js"></script>
</body>
</html>
